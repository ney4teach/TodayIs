name: Подготовить пост

on:
  workflow_dispatch:
    inputs:
      source:
        description: Ссылка на PR или релиз Today Is
        required: true
        type: string
      screenshot:
        description: Сценарий скриншота
        type: choice
        default: auto
        options:
          - auto
          - activity
          - music
          - bookmarks
          - tasks
          - 'off'
      summary:
        description: Короткое описание для подписчиков, если нужно заменить текст из GitHub
        type: string
      image_url:
        description: Прямая HTTPS-ссылка на скриншот (необязательно)
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  capture:
    if: inputs.image_url == '' && inputs.screenshot != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      activity: ${{ steps.version.outputs.activity }}
    steps:
      - name: Выбрать версию расширения
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_URL: ${{ inputs.source }}
          SCREENSHOT: ${{ inputs.screenshot }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const source = /^https:\/\/github\.com\/ney4teach\/TodayIs\/(?:pull\/([1-9]\d*)|releases\/tag\/([^?#\s]+?))\/?$/i.exec(process.env.SOURCE_URL.trim());
          if (!source) throw new Error('Укажите ссылку на PR или релиз Today Is.');
          if (!source[1] && process.env.SCREENSHOT === 'auto') process.exit(0);
          const endpoint = source[1] ? 'pulls/' + source[1] : 'releases/tags/' + encodeURIComponent(decodeURIComponent(source[2]));
          const response = await fetch('https://api.github.com/repos/ney4teach/TodayIs/' + endpoint, {
            signal: AbortSignal.timeout(20000),
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error('GitHub не вернул версию расширения.');
          const data = await response.json();
          const music = process.env.SCREENSHOT === 'music' || /^music\//.test(data.head?.ref || '');
          const layout = /^layout\/editor(?:-|$)/.test(data.head?.ref || '');
          const settings = /^settings\//.test(data.head?.ref || '');
          const backup = /^settings\/config-backup(?:-|$)/.test(data.head?.ref || '');
          const dock = /^settings\/dock(?:-|$)/.test(data.head?.ref || '');
          const bookmarks = process.env.SCREENSHOT === 'bookmarks' || (process.env.SCREENSHOT === 'auto' && /^bookmarks\//.test(data.head?.ref || ''));
          const tasks = process.env.SCREENSHOT === 'tasks' || (process.env.SCREENSHOT === 'auto' && data.head?.ref === 'codex/tasks-widget');
          if (process.env.SCREENSHOT === 'auto' && !tasks && !bookmarks && !music && !layout && !settings && !/^clock\/activity(?:-|$)/.test(data.head?.ref || '')) process.exit(0);
          if (source[1] && (data.head?.repo?.full_name !== 'ney4teach/TodayIs' || !/^[a-f0-9]{40}$/.test(data.head.sha))) {
            throw new Error('Выберите PR из ветки репозитория Today Is.');
          }
          const ref = source[1] ? data.head.sha : 'refs/tags/' + data.tag_name;
          if (/\s/.test(ref)) throw new Error('Некорректная версия расширения.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'activity=true\nref=' + ref + '\nlayout=' + layout + '\nmusic=' + music + '\nsettings=' + settings + '\ndock=' + dock + '\nbookmarks=' + bookmarks + '\nbackup=' + backup + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, 'tasks=' + tasks + '\n');
          NODE
      - uses: actions/checkout@v4
        if: steps.version.outputs.activity == 'true'
        with:
          ref: ${{ steps.version.outputs.ref }}
          path: extension
          persist-credentials: false
      - name: Снять статистику за неделю
        if: steps.version.outputs.activity == 'true'
        env:
          MUSIC_SCREENSHOT: ${{ steps.version.outputs.music }}
          LAYOUT_SCREENSHOT: ${{ steps.version.outputs.layout }}
          SETTINGS_SCREENSHOT: ${{ steps.version.outputs.settings }}
          BACKUP_SCREENSHOT: ${{ steps.version.outputs.backup }}
          DOCK_SCREENSHOT: ${{ steps.version.outputs.dock }}
          BOOKMARKS_SCREENSHOT: ${{ steps.version.outputs.bookmarks }}
          TASKS_SCREENSHOT: ${{ steps.version.outputs.tasks }}
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { resolve } from 'node:path';
          import { chromium } from 'playwright';
          const extension = resolve('extension');
          const context = await chromium.launchPersistentContext('', {
            channel: 'chromium', headless: true, locale: 'ru-RU', viewport: {width: 1280, height: 820},
            args: ['--disable-extensions-except=' + extension, '--load-extension=' + extension],
          });
          await capture();
          async function revealDock(page) {
            const trigger = page.locator('#dock .dock-trigger');
            if (await trigger.count()) await trigger.hover();
          }
          async function capture() {
          try {
            const worker = context.serviceWorkers()[0] ?? await context.waitForEvent('serviceworker');
            if (process.env.TASKS_SCREENSHOT === 'true') {
              const { captureTasks } = await import('./extension/tools/tasks-screenshot.mjs');
              await captureTasks(await context.newPage(),worker,'todayis-activity.png',{quick:true});
              return;
            }
            if (process.env.BOOKMARKS_SCREENSHOT === 'true') {
              await worker.evaluate(async () => {
                const themes = {
                  'Работа': ['github.com', 'figma.com', 'docs.google.com', 'notion.so'],
                  'Музыка': ['music.yandex.ru', 'soundcloud.com', 'bandcamp.com', 'open.spotify.com'],
                  'Почитать': ['habr.com', 'wikipedia.org', 'medium.com', 'arxiv.org'],
                  'Отдых': ['youtube.com', 'twitch.tv', 'steampowered.com', 'kinopoisk.ru'],
                };
                const records = {'gntd.bookmarkSource':'custom'};
                Object.entries(themes).forEach(([title, sites], order) => {
                  const id = 'demo-' + order;
                  records['gntd.linkCategories.' + id] = {id, title, order};
                  sites.forEach((domain, order) => {
                    const siteId = id + '-' + order;
                    records['gntd.siteTiles.' + siteId] = {id:siteId, categoryId:id, title:domain, url:'https://' + domain, order};
                  });
                });
                await chrome.storage.sync.set(records);
              });
              const page = await context.newPage();
              await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
              await page.locator('#board [data-id="bookmarks"] .bookmark-panel .bookmark-tile').last().waitFor();
              await page.evaluate(() => showSettings('bookmarks'));
              const preview = page.locator('.bookmark-preview');
              await preview.getByRole('button', {name:'Работа', exact:true}).click();
              await preview.screenshot({path:'todayis-activity.png',animations:'disabled'});
              return;
            }
            if (process.env.DOCK_SCREENSHOT === 'true') {
              const page = await context.newPage();
              await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
              const trigger = page.getByRole('button', {name: 'Управление новой вкладкой'});
              await trigger.waitFor();
              await revealDock(page);
              await page.getByRole('button', {name: 'Автосортировка', exact: true}).waitFor();
              await page.locator('#dock').screenshot({path:'todayis-activity.png',animations:'disabled'});
              return;
            }
            if (process.env.SETTINGS_SCREENSHOT === 'true') {
              const page = await context.newPage();
              await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
              if (process.env.BACKUP_SCREENSHOT === 'true') {
                await page.evaluate(() => showSettings('account'));
                await page.getByRole('button', {name:'Загрузить с ПК',exact:true}).waitFor();
                await page.addStyleTag({content:'#board,#dock{filter:blur(6px);opacity:.25} #dialog{opacity:1}'});
                await page.evaluate(() => {
                  const logo=document.createElement('img');logo.src='icons/glass.svg';logo.alt='Today Is';
                  logo.style.cssText='position:fixed;left:24px;top:24px;width:44px;height:44px;z-index:99999';
                  document.body.append(logo);
                });
                await page.screenshot({path:'todayis-activity.png',animations:'disabled'});
                return;
              }
              await revealDock(page);
              await page.getByRole('button', {name: 'Настройки', exact: true}).click();
              await page.locator('#settings-wallpaper').selectOption('aurora');
              await page.waitForFunction(() => document.body.style.backgroundImage.includes('aurora.svg'));
              await page.getByRole('combobox', {name: 'Поиск по настройкам'}).fill('цифер');
              await page.getByRole('option', {name: /Циферблат/}).waitFor();
              await page.screenshot({path:'todayis-activity.png',animations:'disabled'});
              return;
            }
            if (process.env.MUSIC_SCREENSHOT === 'true') {
              await context.addInitScript(() => {
                if (!globalThis.chrome?.runtime?.connectNative) return;
                let timer;
                chrome.runtime.connectNative = () => {
                  let onMessage;
                  return {
                    onMessage: {addListener: callback => { onMessage = callback; }},
                    onDisconnect: {addListener() {}},
                    disconnect() { clearTimeout(timer); },
                    postMessage() {
                      timer = setTimeout(() => onMessage({
                        status: 'active', title: 'Ночной маршрут', artist: 'Тихий город',
                        sourceId: 'demo', sources: [{id:'demo', app:'demo', label:'Музыка'}],
                        playing: true, pause: true, play: true, previous: true, next: true,
                        seek: true, start: 0, lower: 0, end: 224, upper: 224, position: 84,
                      }), 0);
                    },
                  };
                };
              });
              const page = await context.newPage();
              await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
              const player = page.locator('[data-id="music"]');
              await player.getByText('Ночной маршрут', {exact:true}).waitFor();
              await player.locator('.music-record').waitFor();
              await player.locator('.system-controls .play svg').waitFor();
              await player.screenshot({path:'todayis-activity.png',animations:'disabled'});
              return;
            }

            if (process.env.LAYOUT_SCREENSHOT === 'true') {
              const page = await context.newPage();
              await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
              await revealDock(page);
              await page.getByRole('button', {name: 'Изменить раскладку', exact: true}).click();
              await page.locator('#board.manage [data-id="search"]').waitFor();
              const card = await page.locator('[data-id="search"]').boundingBox();
              await page.mouse.move(card.x + card.width / 2, card.y + card.height / 2);
              await page.mouse.down();
              await page.mouse.move(card.x + card.width / 2 + 55, card.y + card.height / 2 + 28, {steps: 8});
              await page.locator('#board .ghost:visible').waitFor();
              await page.screenshot({path: 'todayis-activity.png', animations: 'disabled'});
              await page.mouse.up();
              return;
            }

            await worker.evaluate(async () => {
              const day = 86400000;
              const now = Date.now();
              const spans = [
                ['reddit.com', 12, 110], ['figma.com', 5, 85], ['t.me', 4, 48],
                ['youtube.com', 3, 125], ['github.com', 2, 160], ['open-meteo.com', 1.5, 35],
                ['youtube.com', .5, 52], ['github.com', .25, 30],
              ].map(([host, ago, minutes]) => ({host, start: now - ago * day, end: now - ago * day + minutes * 60000}));
              await chrome.storage.local.set({siteActivity: {spans, since: now - 30 * day}});
            });
            const page = await context.newPage();
            page.setDefaultTimeout(15000);
            await page.goto('chrome-extension://' + new URL(worker.url()).hostname + '/newtab.html');
            await revealDock(page);
            await page.locator('#dock button').last().click();
            await page.locator('[data-page="widgets"], [data-section="widgets"]').click();
            await page.locator('[data-page="clock"]').click();
            await page.locator('#dialog #close').click();
            await page.locator('.activity-button .activity-mosaic').waitFor();
            await page.locator('.activity-button').click();
            const dialog = page.locator('#dialog');
            const total = dialog.locator('.activity-summary strong');
            await total.filter({hasText: /^1\sч 22\sмин$/}).waitFor();
            await dialog.getByRole('button', {name: 'Месяц', exact: true}).click();
            await total.filter({hasText: /^10\sч 45\sмин$/}).waitFor();
            await dialog.getByRole('button', {name: '7 дней', exact: true}).click();
            await total.filter({hasText: /^8\sч 55\sмин$/}).waitFor();
            await dialog.locator('summary').filter({hasText: 'Работа и учёба'}).click();
            await dialog.getByText('github.com', {exact: true}).waitFor();
            await dialog.locator('#close').click();
            await revealDock(page);
            await page.locator('#dock button').last().click();
            await page.locator('[data-page="widgets"], [data-section="widgets"]').click();
            await page.locator('[data-page="clock"]').click();
            await dialog.locator('input[name="clock-face"][value="analog"]').check();
            await dialog.locator('.clock-settings-preview .clock-dial').waitFor();
            await dialog.locator('input[name="clock-activityCenter"][value="mascot"]').check();
            await dialog.locator('.clock-settings-preview .activity-peek').waitFor();
            await page.screenshot({
              path: 'todayis-activity.png',
              animations: 'disabled',
              style: '#panel, #dock {filter:blur(6px) brightness(.65)}',
            });
          } finally {
            await context.close();
          }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.activity == 'true'
        with:
          name: todayis-activity
          path: todayis-activity.png
          if-no-files-found: error
          retention-days: 3
  preview:
    needs: capture
    if: ${{ !cancelled() && (needs.capture.result == 'success' || needs.capture.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        if: needs.capture.outputs.activity == 'true'
        with:
          name: todayis-activity
      - name: Отправить черновик в личку
        env:
          SOURCE_URL: ${{ inputs.source }}
          POST_SUMMARY: ${{ inputs.summary }}
          IMAGE_URL: ${{ inputs.image_url }}
          LOCAL_IMAGE: ${{ needs.capture.outputs.activity }}
          GH_TOKEN: ${{ github.token }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_PREVIEW_CHAT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { SOURCE_URL, POST_SUMMARY, IMAGE_URL, LOCAL_IMAGE, GH_TOKEN, BOT_TOKEN, CHAT_ID } = process.env;
          const requestOptions = { signal: AbortSignal.timeout(20000), redirect: 'error' };

          async function sendPreview() {
            if (!BOT_TOKEN || !/^[1-9]\d*$/.test(CHAT_ID ?? '')) {
              throw new Error('Проверьте токен бота и положительный ID личного чата в секретах GitHub.');
            }

            const source = /^https:\/\/github\.com\/ney4teach\/TodayIs\/(pull\/([1-9]\d*)|releases\/tag\/([^?#\s]+))\/?$/i
              .exec(SOURCE_URL.trim());
            if (!source) throw new Error('Укажите ссылку на PR или конкретный релиз Today Is.');
            const endpoint = source[2]
              ? 'pulls/' + source[2]
              : 'releases/tags/' + encodeURIComponent(decodeURIComponent(source[3].replace(/\/$/, '')));
            const response = await fetch('https://api.github.com/repos/ney4teach/TodayIs/' + endpoint, {
              ...requestOptions,
              headers: { Authorization: 'Bearer ' + GH_TOKEN, Accept: 'application/vnd.github+json' },
            });
            if (!response.ok) throw new Error('GitHub не вернул источник. HTTP ' + response.status);
            const sourceData = await response.json();
            const title = (sourceData.title || sourceData.name || sourceData.tag_name).trim();
            const subscriberText = sourceData.body?.split(/^## Для подписчиков\s*$/m)[1]?.split(/^## /m)[0].trim();
            const summary = POST_SUMMARY.trim() || subscriberText || sourceData.body?.trim();
            if (!summary) throw new Error('В источнике нет описания. Заполните поле summary.');

            const image = IMAGE_URL.trim();
            if (image && !/^https:\/\/[^\s]+$/i.test(image)) {
              throw new Error('Для скриншота нужна прямая HTTPS-ссылка.');
            }

            const text = ['Черновик для Today Is', title, summary, sourceData.html_url].join('\n\n');
            const hasPhoto = Boolean(image) || LOCAL_IMAGE === 'true';
            if (text.length > (hasPhoto ? 1024 : 4096)) {
              throw new Error('Черновик слишком длинный. Сократите его через поле summary.');
            }
            const payload = image
              ? { chat_id: CHAT_ID, photo: image, caption: text }
              : { chat_id: CHAT_ID, text, link_preview_options: { is_disabled: true } };

            let body = JSON.stringify(payload);
            let headers = { 'Content-Type': 'application/json' };
            if (LOCAL_IMAGE === 'true') {
              body = new FormData();
              body.set('chat_id', CHAT_ID);
              body.set('caption', text);
              body.set('photo', new Blob([await readFile('todayis-activity.png')], {type:'image/png'}), 'todayis-activity.png');
              headers = undefined;
            }

            let telegram;
            try {
              telegram = await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/' +
                (hasPhoto ? 'sendPhoto' : 'sendMessage'), {
                ...requestOptions,
                method: 'POST',
                headers,
                body,
              });
            } catch {
              throw new Error('Telegram не ответил. Проверьте личку перед повторным запуском.');
            }
            if (!telegram.ok || !(await telegram.json()).ok) {
              throw new Error('Telegram не принял черновик. HTTP ' + telegram.status);
            }
            console.log('Черновик отправлен в личный чат.');
          }

          await sendPreview().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE
