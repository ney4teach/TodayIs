<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Today Is — spring select regression</title>
<link rel="stylesheet" href="../newtab.css">
<script defer src="../settings-select.js"></script><script defer src="settings-select.test.js"></script></head>
<body><dialog id="dialog"><header><h2>Проверка меню</h2><button id="run-spring-test" type="button">Проверить пружину</button></header>
<output id="spring-test-result"></output><div id="fields">
<label class="field">Поисковая система<select id="settings-engine"><option value="Google">Google</option><option value="Яндекс">Яндекс</option><option value="DuckDuckGo">DuckDuckGo</option></select></label>
<label class="field">Папка<select><option>Панель закладок</option><option>Очень длинное название папки с документацией и материалами Today Is</option></select></label>
<label class="field">Тип смены<select id="shift-kind"><option>День</option><option disabled>Недоступный вариант</option><option hidden>Скрытый вариант</option><option>Ночь</option></select></label>
</div></dialog></body></html>
